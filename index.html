<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ledgerline · Enterprise Dashboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="overlay" data-act="menu"></div>
<aside class="sidebar" aria-label="Main navigation">
  <div class="brand"><i data-lucide="layers"></i><span>Ledgerline</span></div>
  <nav id="nav"></nav>
  <div class="profile"><div class="avatar" id="sbAvatar"></div><div class="plabel"><strong id="sbName"></strong><small id="sbRole"></small></div></div>
</aside>
<div class="main">
  <header class="topbar">
    <button class="icon-btn" data-act="menu" aria-label="Toggle sidebar"><i data-lucide="menu"></i></button>
    <div class="title"><h1 id="pageTitle"></h1><p id="pageDesc"></p></div>
    <label class="search"><i data-lucide="search"></i><input id="gsearch" type="search" placeholder="Search tasks by name or ID" aria-label="Search tasks"></label>
    <select id="range" aria-label="Date range"><option value="0">All time</option><option value="7">Last 7 days</option><option value="30">Last 30 days</option><option value="90">Last 90 days</option></select>
    <button class="icon-btn" data-act="go-notifications" aria-label="Notifications"><i data-lucide="bell"></i><span class="dot" id="bellDot" hidden></span></button>
    <div class="menu-wrap">
      <button class="avatar" id="userBtn" data-act="usermenu" aria-haspopup="true" aria-label="User menu"></button>
      <div class="dropdown" id="userMenu" hidden>
        <button data-act="go-settings"><i data-lucide="settings"></i>Settings</button>
        <button data-act="reset"><i data-lucide="rotate-ccw"></i>Restore demo data</button>
      </div>
    </div>
  </header>
  <main id="content"></main>
</div>
<div id="modalRoot"></div>
<div id="toasts" aria-live="polite"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.263.1/dist/umd/lucide.min.js"></script>
<script src="js/data.js"></script>
<script src="js/tasks.js"></script>
<script src="js/projects.js"></script>
<script src="js/team.js"></script>
<script src="js/app.js"></script>
</body>
</html>
